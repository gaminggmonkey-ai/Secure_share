<!DOCTYPE html>
<html>
<head>
    <title>Secure Share</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="wrapper">
    <div class="container">

        <!-- UPLOAD -->
        <div class="card card-accent">
            <div class="title">Upload File</div>

            <form action="/upload" method="post" enctype="multipart/form-data">
                <input class="input" type="file" name="file" required>

                <input class="input" type="text" name="password" placeholder="Password (optional)">

                <input class="input" type="number" name="expiry" placeholder="Expiry (minutes)" required>

                <button class="btn btn-accent">Generate Link</button>
            </form>
        </div>

        <!-- DOWNLOAD -->
        <div class="card">
            <div class="title">Download File</div>

            <form action="/download_manual" method="post">
                <input class="input" type="text" name="file_id" placeholder="Paste Link or ID" required>

                <input class="input" type="password" name="password" placeholder="Password (if required)">

                <button class="btn">Download</button>
            </form>
        </div>

        <!-- LINK DISPLAY
        <div class="card">
            <div class="title">Last Generated Link</div>

            <div class="link-box" id="linkBox">
                No file uploaded yet
            </div>

            <button class="btn" onclick="copyLink()">Copy Link</button>

            <div class="copy-success" id="copyMsg">
                Link copied!
            </div>
        </div> -->

    </div>
</div>

<script>

// Copy interaction
function copyLink() {
    const text = document.getElementById("linkBox").innerText;
    navigator.clipboard.writeText(text);

    const msg = document.getElementById("copyMsg");
    msg.style.display = "block";

    setTimeout(() => {
        msg.style.display = "none";
    }, 2000);
}

</script>

</body>
</html>
